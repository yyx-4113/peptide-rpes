name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            README.md
            LICENSE
            CITATION.cff
            config.py
            b_pivot_analysis.py
            b_pivot_pca_timing.py
            b_pivot_esm2.py
            b_pivot_recompute_rpes.py
            b_pivot_pca_recon.py
            rpes_full_experiment.py
            phase1_pipeline.py
            new_methods.py
